name: ci
on: push

jobs:
  prepare:
    name: test / prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache node_modules 📦
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint-types:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  print-test-names:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          specs=$(find cypress/e2e -type f \( -name "*.cy.ts" -o -name "*.cy.js" \) | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$specs" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: [lint-types, print-test-names]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.print-test-names.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run Cypress 🧪
        uses: cypress-io/github-action@v6
        with:
          install: false
          spec: ${{ matrix.spec }}

  release:
    name: release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm install -g npm@latest
      - name: Build 🏗
        run: npm run build
      - name: Semantic Release 🚀
        uses: cycjimmy/semantic-release-action@v6
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}